schema_version = "1.0.0"

id = "quadre"
version = "0.4.0"
name = "QUADRE"
tagline = "One-button quad remesher for character work"
maintainer = "Prof. David Bayus, CADRE Lab (SJSU)"
type = "add-on"

website = "https://github.com/cadre-lab/quadre"

tags = ["Mesh"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

# The mac dylibs are universal x86_64+arm64 (verified 2026-08-20), so both
# mac platforms are true. No Linux engine binary exists — advertising
# linux-x64 guaranteed a traceback on first press.
platforms = ["windows-x64", "macos-arm64", "macos-x64"]

[permissions]
files = "Import/export temporary OBJ files for quad remeshing"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
]
